name: Publish to PyPI

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[release]"

      - name: Verify release branch matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          branch = os.environ["GITHUB_REF_NAME"]
          expected = f"release/v{version}"
          if branch != expected:
              raise SystemExit(
                  f"release branch {branch!r} does not match package version {expected!r}"
              )
          print(f"release version verified: {version}")
          PY

      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/route-explain-release-smoke
          /tmp/route-explain-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/route-explain-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/route-explain-release-smoke/bin/route-explain --version
          /tmp/route-explain-release-smoke/bin/route-explain --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/route-explain
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/v}"
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "route-explain ${tag}" \
            --generate-notes
