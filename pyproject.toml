[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "route-explain"
version = "0.4.1"
description = "Read-only, kernel-backed Linux routing forensics for explaining why a flow took its path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artur Panek" }]
keywords = ["linux", "networking", "routing", "forensics", "observability", "read-only", "iproute2", "policy-routing", "tailscale", "wireguard", "netns", "nftables", "debugging", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://artur.panek.tech/work/route-explain/"
Repository = "https://github.com/artur-panek/route-explain"
Issues = "https://github.com/artur-panek/route-explain/issues"
Changelog = "https://github.com/artur-panek/route-explain/blob/main/CHANGELOG.md"
Documentation = "https://github.com/artur-panek/route-explain/tree/main/docs"
PyPI = "https://pypi.org/project/route-explain/"

[project.scripts]
route-explain = "route_explain.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]
release = ["build>=1.2", "twine>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/route_explain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
